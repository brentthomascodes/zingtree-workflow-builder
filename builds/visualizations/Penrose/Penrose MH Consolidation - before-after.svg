<svg viewBox="0 0 980 660" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif" role="img">
<title>Penrose mental-health workflow consolidation: five separate trees collapsed into one</title>
<desc>Before: five separate trees totaling 107 nodes, each repeating the same Outcome to Safety-Netting tail. After: one tree of 61 nodes with a single shared dynamic-HTML outcome tail.</desc>
<style>
  text{fill:#1a1a1a;}
  .sub{fill:#666;}
  .q{fill:#eef2ff;stroke:#c7d2fe;}
  .tail{fill:#fef2f2;stroke:#fecaca;}
  .shared{fill:#ecfdf5;stroke:#6ee7b7;}
  .script{fill:#fff7ed;stroke:#fed7aa;}
  .hub{fill:#f5f3ff;stroke:#c4b5fd;}
  rect[class]{stroke-width:1.5;}
  .edge{stroke:#b8b8b8;stroke-width:1.4;fill:none;}
  .hl{fill:#dc2626;}
</style>
<text x="30" y="34" font-size="20" font-weight="700">Penrose MH triage — 5 trees consolidated into 1</text>
<text x="30" y="56" class="sub" font-size="13">Same fields everywhere: outcome (select), suggested_outcome (hidden), other_outcome (multiline) + risk checks</text>
<text x="30" y="96" font-size="15" font-weight="700">BEFORE</text>
<text x="95" y="96" class="sub" font-size="13">5 separate trees · 107 nodes · Outcome→Safety tail repeated 6×</text>
<g font-size="10.5">
  <rect class="q" rx="7" x="30" y="110" width="118" height="30"/><text x="89" y="129" text-anchor="middle">SMI · 11</text>
  <rect class="q" rx="7" x="30" y="146" width="118" height="30"/><text x="89" y="165" text-anchor="middle">Adult MH · 21</text>
  <rect class="q" rx="7" x="30" y="182" width="118" height="30"/><text x="89" y="201" text-anchor="middle">Depression · 9</text>
  <rect class="q" rx="7" x="30" y="218" width="118" height="30"/><text x="89" y="237" text-anchor="middle">CYP · 46</text>
  <rect class="q" rx="7" x="30" y="254" width="118" height="30"/><text x="89" y="273" text-anchor="middle">MH Risk · 20</text>
  <rect class="tail" rx="7" x="182" y="110" width="70" height="30"/><text x="217" y="129" text-anchor="middle">tail</text>
  <rect class="tail" rx="7" x="182" y="146" width="70" height="30"/><text x="217" y="165" text-anchor="middle">tail</text>
  <rect class="tail" rx="7" x="182" y="182" width="70" height="30"/><text x="217" y="201" text-anchor="middle">tail</text>
  <rect class="tail" rx="7" x="182" y="218" width="70" height="30"/><text x="217" y="237" text-anchor="middle">tail ×2</text>
  <rect class="tail" rx="7" x="182" y="254" width="70" height="30"/><text x="217" y="273" text-anchor="middle">→ back</text>
  <path class="edge" d="M148 125 H182"/><path class="edge" d="M148 161 H182"/><path class="edge" d="M148 197 H182"/><path class="edge" d="M148 233 H182"/><path class="edge" d="M148 269 H182"/>
</g>
<rect class="tail" rx="7" x="30" y="304" width="222" height="52"/>
<text x="141" y="324" text-anchor="middle" font-size="11" font-weight="700">Each tail = Outcome + Other-logic</text>
<text x="141" y="340" text-anchor="middle" font-size="11" font-weight="700">+ Other outcome + Safety Netting</text>
<text x="141" y="352" text-anchor="middle" class="hl" font-size="10">~24 outcome screens, duplicated</text>
<path d="M285 230 H330" stroke="#111" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#111"/></marker></defs>
<text x="360" y="96" font-size="15" font-weight="700">AFTER</text>
<text x="425" y="96" class="sub" font-size="13">1 tree · 61 nodes · one shared dynamic-HTML tail</text>
<g font-size="10.5">
  <rect class="script" rx="7" x="360" y="112" width="120" height="28"/><text x="420" y="130" text-anchor="middle">Init script</text>
  <rect class="hub" rx="7" x="360" y="150" width="120" height="28"/><text x="420" y="168" text-anchor="middle">Route: condition?</text>
  <path class="edge" d="M420 140 V150"/>
  <rect class="q" rx="7" x="360" y="196" width="120" height="26"/><text x="420" y="213" text-anchor="middle">SMI screens</text>
  <rect class="q" rx="7" x="360" y="226" width="120" height="26"/><text x="420" y="243" text-anchor="middle">Adult MH screens</text>
  <rect class="q" rx="7" x="360" y="256" width="120" height="26"/><text x="420" y="273" text-anchor="middle">Depression screens</text>
  <rect class="q" rx="7" x="360" y="286" width="120" height="26"/><text x="420" y="303" text-anchor="middle">CYP screens</text>
  <rect class="q" rx="7" x="360" y="316" width="120" height="26"/><text x="420" y="333" text-anchor="middle">Risk screens</text>
  <path class="edge" d="M420 178 V196"/>
  <path class="edge" d="M485 209 C520 209 520 250 520 250"/><path class="edge" d="M485 239 H520"/><path class="edge" d="M485 269 H520"/><path class="edge" d="M485 299 C520 299 520 250 520 250"/><path class="edge" d="M485 329 C520 329 520 250 520 250"/>
  <rect class="script" rx="7" x="524" y="232" width="96" height="36"/><text x="572" y="248" text-anchor="middle">21 setters</text>
  <text x="572" y="261" text-anchor="middle" class="sub" font-size="9">set outcome_key</text>
</g>
<rect class="shared" rx="7" x="640" y="150" width="300" height="30"/><text x="790" y="169" text-anchor="middle" font-size="11" font-weight="700">Catalog script (node 88)</text>
<rect class="shared" rx="7" x="640" y="196" width="300" height="30"/><text x="790" y="215" text-anchor="middle" font-size="11">Outcome screen — dynamic HTML + select</text>
<rect class="hub" rx="7" x="640" y="242" width="300" height="30"/><text x="790" y="261" text-anchor="middle" font-size="11">Other outcome? (router)</text>
<rect class="shared" rx="7" x="640" y="288" width="145" height="30"/><text x="712" y="307" text-anchor="middle" font-size="11">Other outcome</text>
<rect class="shared" rx="7" x="795" y="288" width="145" height="30"/><text x="867" y="307" text-anchor="middle" font-size="11">Safety Netting</text>
<path class="edge" d="M620 250 C632 250 632 165 640 165"/><path class="edge" d="M790 180 V196"/><path class="edge" d="M790 226 V242"/><path class="edge" d="M712 272 V288"/><path class="edge" d="M867 272 V288"/><path class="edge" d="M785 303 H795"/>
<text x="790" y="340" text-anchor="middle" class="hl" font-size="10" font-weight="700">24 outcome screens → 1 catalog + 1 shared screen</text>
<g font-size="11">
  <rect class="q" rx="4" x="30" y="470" width="16" height="14"/><text x="52" y="481">Content / question screen (native fields)</text>
  <rect class="script" rx="4" x="330" y="470" width="16" height="14"/><text x="352" y="481">Script node (eval / setter / catalog)</text>
  <rect class="hub" rx="4" x="600" y="470" width="16" height="14"/><text x="622" y="481">Router (tests script booleans)</text>
  <rect class="shared" rx="4" x="30" y="492" width="16" height="14"/><text x="52" y="503">Shared dynamic-HTML outcome tail</text>
  <rect class="tail" rx="4" x="330" y="492" width="16" height="14"/><text x="352" y="503">Duplicated tail (before)</text>
</g>
<rect x="30" y="536" width="910" height="96" rx="9" fill="#f7f7f8" stroke="#e2e2e5"/>
<text x="50" y="562" font-size="13" font-weight="700">What collapsed</text>
<text x="50" y="584" class="sub" font-size="12">107 → 61 nodes. The Outcome→Other-logic→Other→Safety tail (repeated in all 5 trees) becomes ONE shared 4-node tail.</text>
<text x="50" y="604" class="sub" font-size="12">24 per-condition outcome screens → one catalog script (21 keyed HTML entries) staged into a single dynamic-HTML content node.</text>
<text x="50" y="624" class="sub" font-size="12">Every routing decision is eval-script → router (tests booleans only). Inputs are native selects; dynamic HTML only for display.</text>
</svg>
