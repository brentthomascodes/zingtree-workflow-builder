    <path d="M370 1069 h60 q14 0 14 -14 V761 q0 -14 -14 -14 h-6" marker-end="url(#arrA)"/>
    <path d="M370 1023 h30 q14 0 14 -14 V945 q0 -14 -14 -14 h-6" marker-end="url(#arrA)"/>
